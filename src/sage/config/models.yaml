routing:
  # ── Planner ────────────────────────────────────────────────────────────────
  planner:
    primary: "qwen2.5-coder:7b-instruct-q4_K_M"
    fallback: "qwen2.5-coder:14b-instruct-q4_K_M"
    fallback_triggers:
      - task_complexity_score > 0.8
      - primary_failure_count >= 2

  # ── Architect ──────────────────────────────────────────────────────────────
  architect:
    primary: "qwen2.5-coder:7b-instruct-q4_K_M"
    fallback: "qwen2.5-coder:14b-instruct-q4_K_M"
    fallback_triggers:
      - task_complexity_score > 0.8
      - primary_failure_count >= 2

  # ── Coder ──────────────────────────────────────────────────────────────────
  # Runs an agentic ReAct tool-use loop. Needs reliable JSON emission.
  # Tier (single-GPU):
  #   ~5 GB  → qwen2.5-coder:7b-instruct-q4_K_M   (fast, adequate)
  #   ~10 GB → qwen2.5-coder:14b-instruct-q4_K_M  (best quality on this machine)
  coder:
    primary: "qwen2.5-coder:7b-instruct-q4_K_M"
    fallback: "qwen2.5-coder:14b-instruct-q4_K_M"
    fallback_triggers:
      - primary_failure_count >= 2

  # ── Debugger ───────────────────────────────────────────────────────────────
  # Strong reasoning on stack traces. Use largest available model.
  debugger:
    primary: "qwen2.5-coder:14b-instruct-q4_K_M"
    fallback: "qwen2.5-coder:7b-instruct-q4_K_M"
    fallback_triggers:
      - primary_failure_count >= 1

  # ── Reviewer ───────────────────────────────────────────────────────────────
